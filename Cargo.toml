[package]
name = "comprimer"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Windows Explorer image compression and conversion with an egui settings app"
license = "MIT"
build = "build.rs"

[[bin]]
name = "Comprimer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winreg = "0.56"

[dev-dependencies]
# Integration tests inspect WebP output; production uses cwebp/dwebp.
image = { version = "0.25", default-features = false, features = ["webp"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 1

# Keep image resizing and built-in codecs fast.
[profile.release.package.image]
opt-level = 3
