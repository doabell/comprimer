name: Windows CI and draft release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # CI test symbols inflate linking time and cache size; release PDBs remain enabled.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test CI helpers
        run: node --test scripts/ci.test.mjs

      - name: Select checks from changed paths
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci.mjs plan

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match Cargo.toml.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }

      - name: Reuse verified main package
        id: reuse
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci.mjs reuse

      - name: Set up pinned Rust toolchain
        if: (steps.plan.outputs.rust == 'true' || steps.plan.outputs.package == 'true') && steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches.Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
          rustc --version
          cargo --version

      - name: Restore check cache
        id: verify-cache
        if: steps.plan.outputs.rust == 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rust-verify-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-verify-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        if: steps.plan.outputs.rust == 'true' && steps.reuse.outputs.reused != 'true'
        run: cargo fmt --all -- --check

      - name: Test
        id: test
        if: steps.plan.outputs.rust == 'true' && steps.reuse.outputs.reused != 'true'
        run: cargo test --locked --all-targets --timings

      - name: Clippy
        if: steps.plan.outputs.rust == 'true' && steps.reuse.outputs.reused != 'true'
        run: cargo clippy --locked --all-targets --timings -- -D warnings

      # Save before packaging, retaining both test code and Clippy's metadata.
      - name: Save check cache
        if: ${{ !cancelled() && steps.test.outcome == 'success' && steps.verify-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.verify-cache.outputs.cache-primary-key }}

      - name: Restore release cache
        id: release-cache
        if: steps.plan.outputs.package == 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: rust-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build Windows executable
        id: build
        if: steps.plan.outputs.package == 'true' && steps.reuse.outputs.reused != 'true'
        run: cargo build --locked --release --timings

      - name: Save release cache
        if: steps.build.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

      - name: Package
        if: steps.plan.outputs.package == 'true' && steps.reuse.outputs.reused != 'true'
        run: ./scripts/package.ps1

      - name: Verify package
        if: steps.plan.outputs.package == 'true'
        run: node scripts/ci.mjs verify-package

      - name: Upload Windows package
        if: steps.plan.outputs.package == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Comprimer-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        if: steps.plan.outputs.package == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Comprimer-debug-symbols-win-x64
          path: symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rust build timings
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.build.outcome == 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-build-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Comprimer-win-x64
          path: publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Comprimer-debug-symbols-win-x64
          path: symbols
      - name: Verify package
        run: node scripts/ci.mjs verify-package
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/draft-release.ps1
