name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/Comprimer/Comprimer.csproj --configuration Release --runtime win-x64 --no-self-contained --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comprimer-win-x64
          path: ./publish/
          if-no-files-found: error
