name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/Comprimer/Comprimer.csproj --configuration Release --runtime win-x64 --self-contained --output ./publish

      - name: Create zip
        run: Compress-Archive -Path ./publish/* -DestinationPath Comprimer-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Comprimer-*.zip
          generate_release_notes: true
